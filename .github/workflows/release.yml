name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          test -f "docs/releases/$RELEASE_TAG.md"
  windows:
    needs: validate-tag
    uses: ./.github/workflows/windows.yml
  macos:
    needs: validate-tag
    uses: ./.github/workflows/macos.yml
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify assets and publish one cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -s "release/YConnect-$version-windows-x64-setup.exe"
          test -s "release/YConnect-$version-windows-x64.zip"
          test -s "release/YConnect-$version-darwin-universal.dmg"
          (cd release && sha256sum *.exe *.zip *.dmg > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "YConnect $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --latest
