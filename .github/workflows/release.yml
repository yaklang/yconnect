name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication so an older run cannot move latest backwards.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version, notes and release index behavior
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          python3 script/version.py
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$IS_TAG" == true ]]; then test "$RELEASE_TAG" = "v$version"; fi
          test -f "docs/releases/v$version.md"
          for script in script/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s script/tests -v
  windows:
    needs: validate
    uses: ./.github/workflows/windows.yml
    with:
      sign-release: true
    secrets:
      AZURE_YAK_CODE_SIGN_KEY_VAULT_URI: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_URI }}
      AZURE_YAK_CODE_SIGN_KEY_VAULT_APPLICATION_ID: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_APPLICATION_ID }}
      AZURE_YAK_CODE_SIGN_KEY_VAULT_CLIENT_SECRET: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_CLIENT_SECRET }}
      AZURE_YAK_CODE_SIGN_KEY_VAULT_CERT_NAME: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_CERT_NAME }}
      AZURE_YAK_CODE_SIGN_KEY_VAULT_DIRECTORY_ID: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_DIRECTORY_ID }}
      AZURE_YAK_CODE_SIGN_KEY_VAULT_TIMESTAMP_URL: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_TIMESTAMP_URL }}
  macos:
    needs: validate
    uses: ./.github/workflows/macos.yml
    with:
      sign-release: true
    secrets:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ACCOUNT_EMAIL: ${{ secrets.APPLE_ACCOUNT_EMAIL }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
  prepare-updates:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate manifest and signed update feeds
        env:
          YCONNECT_UPDATE_PRIVATE_KEY: ${{ secrets.YCONNECT_UPDATE_PRIVATE_KEY }}
        run: |
          python3 script/prepare-release-assets.py release
          python3 script/sign-appcasts.py release
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-release
          path: release/*
          if-no-files-found: error
  publish:
    needs: prepare-updates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PUBLIC_BASE_URL: https://aliyun-oss.yaklang.com/yconnect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: release
      - name: Install official OSS client
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/aliyun/ossutil@v1.7.19
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Upload and verify version files and release indexes
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
        run: bash script/publish-oss.sh release release-index
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Y CONNECT $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-publication-evidence
          path: |
            release/manifest.json
            release/SHA256SUMS*
            release-index/*.json
            release-index/*.txt
            release-index/*.xml
