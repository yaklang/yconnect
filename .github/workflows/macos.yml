name: macOS

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      sign-release:
        description: Verify a signed release package without publishing
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign-release:
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_ACCOUNT_EMAIL:
        required: false
      APPLE_APP_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-render:
    name: Build, test, render, package
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.build|DerivedData)(/|$)|\.app/|\.dmg$'; then
            echo "Tracked build artifact detected" >&2
            exit 1
          fi
          for script in script/*.sh; do bash -n "$script"; done
          python3 script/version.py

      - name: Build release
        run: |
          swift --version
          swift build --package-path darwin --configuration release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --package-path darwin -Xswiftc -warnings-as-errors

      - name: Render UI previews
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(swift build --package-path darwin --configuration release -Xswiftc -warnings-as-errors --show-bin-path)/YConnect"
          mkdir -p artifacts
          "$BIN" --render-widget artifacts/widget.png
          for client in opencode pi claude-code claude-desktop codex grok-build openclaw hermes; do
            "$BIN" --render-manager "artifacts/manager-$client.png" --section clients --client "$client"
            test "$(sips -g pixelWidth "artifacts/manager-$client.png" | awk '/pixelWidth/ {print $2}')" = "1080"
            test "$(sips -g pixelHeight "artifacts/manager-$client.png" | awk '/pixelHeight/ {print $2}')" = "720"
          done
          "$BIN" --render-edge-dock artifacts/edge-dock.png
          "$BIN" --render-tray-icon artifacts/tray-icon.png
          test "$(sips -g pixelWidth artifacts/widget.png | awk '/pixelWidth/ {print $2}')" = "400"
          widget_height="$(sips -g pixelHeight artifacts/widget.png | awk '/pixelHeight/ {print $2}')"
          test "$widget_height" -ge 300
          test "$widget_height" -le 760
          "$BIN" --render-widget artifacts/widget-dark.png --dark
          "$BIN" --render-widget artifacts/widget-compact.png --maximum-height 600
          "$BIN" --render-widget artifacts/widget-api-key.png --api-key-mode
          test "$(sips -g pixelHeight artifacts/widget-compact.png | awk '/pixelHeight/ {print $2}')" = "600"
          test "$(sips -g pixelWidth artifacts/edge-dock.png | awk '/pixelWidth/ {print $2}')" = "158"
          test "$(sips -g pixelHeight artifacts/edge-dock.png | awk '/pixelHeight/ {print $2}')" = "112"
          test "$(sips -g pixelWidth artifacts/tray-icon.png | awk '/pixelWidth/ {print $2}')" = "220"
          test "$(sips -g pixelHeight artifacts/tray-icon.png | awk '/pixelHeight/ {print $2}')" = "220"

      - name: Smoke test widget focus behavior
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(swift build --package-path darwin --configuration release -Xswiftc -warnings-as-errors --show-bin-path)/YConnect"
          "$BIN" --development --smoke-widget-focus
          "$BIN" --development --smoke-widget-transient
          "$BIN" --development --smoke-edge-widget-focus

      - name: Ensure ImageMagick
        run: command -v magick >/dev/null 2>&1 || brew install imagemagick

      - name: Package development app
        run: ./script/package-macos.sh --dev --dmg

      - name: Verify app bundle and mounted DMG
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=amd64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          app="dist/darwin-dev-$arch/Y CONNECT Dev.app"
          dmg="dist/YConnectDev-$version-darwin-$arch.dmg"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "io.yaklang.yconnect.dev"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$GITHUB_RUN_NUMBER"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true' EXIT
          mounted_app="$mount_dir/Y CONNECT Dev.app"
          test -x "$mounted_app/Contents/MacOS/YConnect"
          codesign --verify --deep --strict "$mounted_app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mounted_app/Contents/Info.plist")" = "io.yaklang.yconnect.dev"

      - name: Package universal production app
        run: ./script/package-macos.sh --arch universal

      - name: Developer ID sign, notarize and staple app
        if: inputs.sign-release
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ACCOUNT_EMAIL }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./script/macos-codesign.sh "dist/darwin-universal/Y CONNECT.app"
          ./script/macos-notarize.sh "dist/darwin-universal/Y CONNECT.app"

      - name: Verify packaged launcher
        run: python3 script/test-macos-launcher.py "dist/darwin-universal/Y CONNECT.app/Contents/MacOS/YConnect"

      - name: Create production DMG
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          ./script/create-macos-dmg.sh "dist/darwin-universal/Y CONNECT.app" "$version" universal "dist/YConnect-$version-darwin-universal.dmg"

      - name: Notarize and staple DMG
        if: inputs.sign-release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ACCOUNT_EMAIL }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./script/macos-notarize.sh "dist/YConnect-$(tr -d '[:space:]' < VERSION)-darwin-universal.dmg"

      - name: Verify universal release DMG
        env:
          SIGN_RELEASE: ${{ inputs.sign-release }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          dmg="dist/YConnect-$version-darwin-universal.dmg"
          hdiutil verify "$dmg"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true' EXIT
          app="$mount_dir/Y CONNECT.app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/YConnect" -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "io.yaklang.yconnect"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test -L "$mount_dir/Applications"
          if [[ "$SIGN_RELEASE" == true ]]; then
            codesign -d --verbose=4 "$app" 2> "$RUNNER_TEMP/release-signature.txt"
            grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" "$RUNNER_TEMP/release-signature.txt"
            grep -q '^Authority=Developer ID Application:' "$RUNNER_TEMP/release-signature.txt"
            xcrun stapler validate "$app"
            xcrun stapler validate "$dmg"
            spctl --assess --type execute --verbose=4 "$app"
            echo "Developer ID, notarization, stapling and Gatekeeper verified"
          fi

      - name: Upload macOS release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/YConnect-*-darwin-universal.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: yconnect-macos-ci
          path: |
            artifacts/*.png
            dist/YConnectDev-*-darwin-*.dmg
          if-no-files-found: error
          retention-days: 14
