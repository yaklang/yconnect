name: Windows native
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      sign-release:
        description: Verify a signed release package without publishing
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign-release:
        type: boolean
        default: false
    secrets:
      AZURE_YAK_CODE_SIGN_KEY_VAULT_URI:
        required: false
      AZURE_YAK_CODE_SIGN_KEY_VAULT_APPLICATION_ID:
        required: false
      AZURE_YAK_CODE_SIGN_KEY_VAULT_CLIENT_SECRET:
        required: false
      AZURE_YAK_CODE_SIGN_KEY_VAULT_CERT_NAME:
        required: false
      AZURE_YAK_CODE_SIGN_KEY_VAULT_DIRECTORY_ID:
        required: false
      AZURE_YAK_CODE_SIGN_KEY_VAULT_TIMESTAMP_URL:
        required: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned signing tool
        if: inputs.sign-release
        run: dotnet tool install --global AzureSignTool --version 6.0.1
      - name: Check version
        run: python script/version.py
      - name: Build, test and package native WPF app
        shell: pwsh
        env:
          SIGN_RELEASE: ${{ inputs.sign-release }}
          WINDOWS_CODE_SIGN_KEY_VAULT_URI: ${{ inputs.sign-release && secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_URI || '' }}
          WINDOWS_CODE_SIGN_CLIENT_ID: ${{ inputs.sign-release && secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_APPLICATION_ID || '' }}
          WINDOWS_CODE_SIGN_CLIENT_SECRET: ${{ inputs.sign-release && secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_CLIENT_SECRET || '' }}
          WINDOWS_CODE_SIGN_CERT_NAME: ${{ inputs.sign-release && secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_CERT_NAME || '' }}
          WINDOWS_CODE_SIGN_TENANT_ID: ${{ inputs.sign-release && secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_DIRECTORY_ID || '' }}
          WINDOWS_CODE_SIGN_TIMESTAMP_URL: ${{ inputs.sign-release && secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_TIMESTAMP_URL || '' }}
        run: ./windows/build.ps1 -Test -Smoke -RechargeSmoke -LauncherSmoke -Package -Installer -Sign:($env:SIGN_RELEASE -eq 'true')
      - name: Verify installer and uninstaller in the disposable runner
        env:
          SIGN_RELEASE: ${{ inputs.sign-release }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem windows/artifacts/release/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected exactly one installer' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'YConnect-install-check'
          $install = Start-Process -FilePath $setup[0].FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="{0}"' -f $installDirectory) -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $installed = Join-Path $installDirectory 'YConnect.exe'
          if (-not (Test-Path -LiteralPath $installed)) { throw 'Installed app is missing' }
          $source = (Get-FileHash windows/YConnect/bin/Release/net48/YConnect.exe).Hash
          if ((Get-FileHash -LiteralPath $installed).Hash -ne $source) { throw 'Installed executable differs from the tested build' }
          if ($env:SIGN_RELEASE -eq 'true') {
            ./windows/verify-release.ps1 -InstallDirectory $installDirectory
          }
          $remove = Start-Process -FilePath (Join-Path $installDirectory 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($remove.ExitCode -ne 0 -or (Test-Path -LiteralPath $installed)) { throw 'Uninstall verification failed' }
      - name: Verify native updater accepts signed downloads and rejects tampering
        shell: pwsh
        run: |
          $env:PATH = 'C:\Program Files\Git\usr\bin;' + $env:PATH
          python script/test-windows-updater.py windows/YConnect.Tests/bin/Release/net48/YConnect.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native update signature verification failed' }
      - name: Verify upgrade from published 0.4.0 and automatic relaunch
        shell: pwsh
        run: ./windows/verify-upgrade.ps1
      - name: Upload Windows release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows/artifacts/release/*
          if-no-files-found: error
      - name: Upload portable build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YConnect-windows-x64
          path: |
            windows/artifacts/*.zip
            windows/.test-output/**/*.txt
            windows/.test-output/**/*.png
          include-hidden-files: true
